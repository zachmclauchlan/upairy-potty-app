<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UpAiry Potty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --sunk:#EFEDE7; --line:#E6E3DB;
  --ink:#16181B; --ink-2:#5E6269; --ink-3:#9A9DA3;
  --brand:#3E7F33; --brand-ink:#2B5C23; --brand-soft:#E8F2E3; --brand-tint:#CFE5C6;
  --acc:#C9762A; --acc-soft:#FBEEDF;
  --water:#3A78C9; --water-soft:#E6EFFA;
  --sun:#C79A1E; --sun-soft:#FBF3DA;
  --poo:#8B6447; --poo-soft:#F3EAE2;
  --radius:22px;
  --shadow:0 1px 2px rgba(22,24,27,.04),0 8px 24px rgba(22,24,27,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E4E2DA;font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.4;color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.phone{position:relative;width:100%;max-width:400px;height:100dvh;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){.phone{height:844px;max-width:390px;border-radius:52px;box-shadow:0 0 0 11px #121314,0 40px 90px rgba(0,0,0,.28)}}
.status{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;position:relative;z-index:60}
.status .island{width:118px;height:34px;border-radius:20px;background:#121314}
@media (max-width:519px){.status{display:none}}
.status .sig{display:flex;gap:6px;align-items:center}
.screen{flex:1;overflow-y:auto;padding:8px 20px 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* header */
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 18px;gap:10px}
.hd .eyebrow{font-size:13px;color:var(--ink-2);font-weight:500}
.hd h1{font-size:30px;line-height:1.1;margin:2px 0 0;font-weight:700;letter-spacing:-.02em}
.kidchip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px;flex:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}

.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg svg.i{width:16px;height:16px}

.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec h2{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.sec .link,.link{font-size:13px;font-weight:600;color:var(--brand)}
.lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.sub{font-size:13px;color:var(--ink-2)}

/* next try */
.next{padding:20px 18px 18px;text-align:center}
.next .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ring{position:relative;width:216px;height:216px;margin:4px auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px}
.ring .n{font-size:60px;font-weight:600;letter-spacing:-.04em;line-height:1}
.ring .u{font-size:13px;color:var(--ink-2);margin-top:6px}
.ring.due .n{color:var(--acc);font-size:38px}
.ring.idle .n{font-size:20px;letter-spacing:-.01em;line-height:1.25}
.why{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);background:var(--sunk);padding:6px 12px;border-radius:14px;margin-top:4px;text-align:left}
.why svg.i{width:15px;height:15px}
.learn{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--water-soft);text-align:left}
.learn .tx{flex:1;font-size:12.5px;color:#28507F}
.learn .tx b{font-weight:600;display:block;font-size:13px;color:#1F4370}
.dotsrow{display:flex;gap:3px;margin-top:6px}
.dotsrow i{width:14px;height:5px;border-radius:9px;background:rgba(58,120,201,.2)}
.dotsrow i.on{background:var(--water)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--brand);color:#fff;font-weight:600;font-size:16px;margin-top:16px;transition:transform .1s;text-align:center}
.primary:active{transform:scale(.98)}
.primary.sm{height:46px;font-size:15px;margin-top:12px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:16px;background:var(--sunk);font-weight:600;margin-top:10px;text-align:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:14px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--ink)}
.q .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.q:active{transform:scale(.96)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 4px}
.stats div{text-align:center;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.stats small{font-size:11px;color:var(--ink-2);font-weight:500}

/* alert */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--poo-soft);margin-bottom:12px}
.alert .ic{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--poo);flex:none}
.alert b{font-weight:600;font-size:14px;display:block}
.alert p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.alert .more{font-size:13px;font-weight:600;color:var(--poo);margin-top:6px;display:inline-block}

/* plan */
.plan .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan h3{margin:6px 0 2px;font-size:17px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);padding:4px 9px;border-radius:99px;white-space:nowrap}
.badge svg.i{width:13px;height:13px}
.badge.grey{background:var(--sunk);color:var(--ink-2)}
.badge.blue{background:var(--water-soft);color:#28507F}
.expect{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14px}
.step:first-of-type{margin-top:12px}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:1.8px solid #CFCBC1;display:grid;place-items:center;color:transparent;margin-top:1px}
.box svg.i{width:14px;height:14px;stroke-width:2.6}
.step.done .box{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done span{color:var(--ink-3);text-decoration:line-through}
.checkin{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--sunk);text-align:left}
.checkin.hot{background:var(--brand-soft);color:var(--brand-ink)}
.checkin .tx{flex:1}
.checkin b{font-weight:600;font-size:14px;display:block}
.checkin small{font-size:12px;color:var(--ink-2)}
.meter{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:9px}

/* timeline */
.tl{padding:6px 18px}
.ev{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ev .ic svg.i{width:18px;height:18px}
.ev .tx{flex:1;min-width:0}
.ev .tx b{font-weight:600;font-size:14px;display:block}
.ev .tx small{font-size:12px;color:var(--ink-2)}
.ev .tm{font-size:13px;color:var(--ink-2);text-align:right}
.ev .del{color:var(--ink-3);padding:6px;margin-right:-6px}
.gap{font-size:11px;color:var(--ink-3);padding:0 0 0 50px;margin:-4px 0 -4px}
.empty{padding:22px 0;text-align:center;color:var(--ink-2);font-size:14px}

/* tones */
.t-ok{background:var(--brand-soft);color:var(--brand-ink)}
.t-acc{background:var(--acc-soft);color:var(--acc)}
.t-try{background:var(--sunk);color:var(--ink-2)}
.t-water{background:var(--water-soft);color:var(--water)}
.t-sun{background:var(--sun-soft);color:var(--sun)}
.t-poo{background:var(--poo-soft);color:var(--poo)}
.t-meal{background:#F1ECF7;color:#7559A8}

/* history */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .dw{font-size:11px;color:var(--ink-3);font-weight:500;padding-bottom:4px}
.dcell{padding:8px 0 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;font-size:15px;text-align:center}
.dcell.sel{background:var(--ink);color:#fff}
.dcell.sel .pct{color:rgba(255,255,255,.7)}
.dcell.out{color:var(--ink-3)}
.dcell .pct{font-size:10px;font-weight:600;color:var(--ink-2);height:12px}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calnav b{font-weight:600}
.calnav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.daysum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.daysum div{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px}
.daysum b{font-size:22px;font-weight:600;display:block;letter-spacing:-.02em}
.daysum small{font-size:12px;color:var(--ink-2)}

/* insights */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{margin-top:8px}
.lrow .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{font-weight:600;font-size:14px;display:block}
.lrow .tx small{font-size:12px;color:var(--ink-2)}
.lrow .v{text-align:right;font-weight:600;font-size:15px;white-space:nowrap}
.lrow .v small{display:block;font-weight:500;font-size:11px;color:var(--ink-3)}
.conf{display:flex;gap:2px;margin-top:5px}
.conf i{width:16px;height:4px;border-radius:9px;background:var(--sunk)}
.conf i.on{background:var(--water)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
.metric b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;margin:4px 0 0}
.metric .d{font-size:12px;font-weight:600}
.up{color:var(--brand)} .down{color:var(--acc)}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:14px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.chart .bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--brand-tint)}
.chart .c.last .bar{background:var(--brand)}
.chart small{font-size:10px;color:var(--ink-3);font-weight:500}
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-top:14px}
.heat i{height:34px;border-radius:6px;background:var(--sunk)}
.heatlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:6px}
.tipbox{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--brand-soft);color:var(--brand-ink);font-size:14px;margin-bottom:12px}
.tipbox svg.i{margin-top:2px}

/* program */
.pitem{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.pitem:first-child{border-top:0}
.pitem .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--sunk);color:var(--ink-2)}
.pitem .n svg.i{width:15px;height:15px;stroke-width:2.4}
.pitem.done .n{background:var(--brand-soft);color:var(--brand)}
.pitem.cur .n{background:var(--brand);color:#fff}
.pitem .tx{flex:1}
.pitem b{font-weight:600;font-size:15px;display:block}
.pitem small{font-size:13px;color:var(--ink-2)}
.pitem .chev{color:var(--ink-3);margin-top:4px}
.phero{border-radius:var(--radius);padding:20px;background:var(--brand);color:#fff;margin-bottom:12px}
.phero .lbl{color:rgba(255,255,255,.75)}
.phero h2{margin:6px 0 4px;font-size:24px;font-weight:600;letter-spacing:-.02em}
.phero p{margin:0;font-size:14px;opacity:.88}
.phero .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.phero .pill{background:rgba(255,255,255,.16);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.phero .pill svg.i{width:14px;height:14px}
.phero .meter{background:rgba(255,255,255,.2);margin-top:14px}
.phero .meter i{background:#fff}
.art{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.art:first-child{border-top:0}
.art .th{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center}
.art b{font-size:14px;font-weight:600;display:block}
.art small{font-size:12px;color:var(--ink-2)}
.art .chev{margin-left:auto;color:var(--ink-3)}

/* tabbar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;padding-bottom:20px;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3)}
.tabs button svg.i{width:23px;height:23px}
.tabs button.on{color:var(--brand)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(15,17,20,.38);z-index:20;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 20px 34px;max-height:90%;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.scrim.show .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:#D3D0C8;margin:4px auto 14px}
.sheethd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.sheethd h2{margin:0;font-size:19px;font-weight:600;text-align:center}
.sheethd button{font-weight:600;color:var(--ink-2);font-size:15px}
.field{margin-bottom:18px}
.field>.lbl{display:block;margin:0 0 8px 2px}
.opts{display:grid;gap:8px}
.opt{border-radius:14px;background:var(--surface);border:1.5px solid var(--line);padding:12px 8px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.opt svg.i{width:20px;height:20px}
.opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.opt.on.acc{border-color:var(--acc);background:var(--acc-soft);color:#8A4E15}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.txt{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.txt:focus{outline:none;border-color:var(--brand)}
.pre{white-space:pre-wrap;background:var(--surface);border-radius:16px;padding:16px;font-size:14px;line-height:1.55;border:1px solid var(--line)}
.rec{border-radius:18px;padding:16px;background:var(--surface);border:1px solid var(--line);margin:14px 0 4px}
.rec .lbl{display:flex;align-items:center;gap:6px}
.rec b{display:block;font-size:16px;font-weight:600;margin:6px 0 4px}
.rec p{margin:0;font-size:13.5px;color:var(--ink-2)}
.textbtn{display:block;width:100%;text-align:center;font-weight:600;color:var(--ink-2);font-size:14px;margin-top:14px}

/* option cards (onboarding / method) */
.ocard{display:flex;gap:14px;align-items:flex-start;width:100%;padding:15px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:10px;text-align:left}
.ocard.on{border-color:var(--brand);background:var(--brand-soft)}
.ocard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ocard .tx{flex:1}
.ocard b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex-wrap:wrap}
.ocard small{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.ocard .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.radio{width:22px;height:22px;border-radius:50%;border:1.8px solid #CFCBC1;flex:none;margin-top:2px;display:grid;place-items:center}
.ocard.on .radio{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px var(--brand-soft)}

/* toast + banner */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:12px;font-size:14px;z-index:30;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .tx{flex:1}
.toast .tx small{display:block;color:rgba(255,255,255,.65);font-size:12px}
.toast button{font-weight:600;color:#9DD68F;font-size:14px}
.banner{position:absolute;left:10px;right:10px;top:10px;z-index:70;background:rgba(250,250,248,.94);backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.18);transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.2,1);color:#16181B}
@media (min-width:520px){.banner{top:52px}}
.banner.show{transform:none}
.banner .app{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:Chewy,cursive;font-size:18px;flex:none}
.banner .tx{flex:1;font-size:13.5px}
.banner .tx b{font-weight:600;display:block}
.banner .tx span{color:#5E6269}
.banner .when{font-size:12px;color:#9A9DA3}

/* sit timer + celebrate */
.full{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.full.show{display:flex}
.sit{background:#FBF7EC;z-index:46}
.sit .big{font-family:Chewy,cursive;font-size:44px;line-height:1;color:var(--ink)}
.sit p{font-size:15px;color:var(--ink-2);margin:10px 0 0}
.sit .sand{width:220px;height:220px;margin-bottom:14px}
.celeb{background:var(--brand);color:#fff;overflow:hidden}
.celeb h2{font-family:Chewy,cursive;font-weight:400;font-size:52px;line-height:1;margin:18px 0 8px}
.celeb p{margin:0;font-size:16px;opacity:.85}
.celeb .star{width:180px;height:180px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.celeb .hint{position:absolute;bottom:44px;font-size:13px;opacity:.7}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(880px) rotate(540deg)}}

/* tour */
.tour{position:absolute;inset:0;z-index:55;display:none}
.tour.show{display:block}
.tour .spot{position:absolute;border-radius:20px;box-shadow:0 0 0 2000px rgba(15,17,20,.62);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour .tip{position:absolute;left:16px;right:16px;background:var(--surface);color:var(--ink);border-radius:20px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25);transition:top .3s}
.tour .tip .lbl{color:var(--brand)}
.tour .tip b{display:block;font-size:17px;font-weight:600;margin:4px 0 4px}
.tour .tip p{margin:0;font-size:14px;color:var(--ink-2)}
.tour .tip .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.tour .tip .row button.nx{background:var(--brand);color:#fff;font-weight:600;padding:9px 16px;border-radius:12px;font-size:14px}
.tour .tip .row button.sk{font-weight:600;color:var(--ink-2);font-size:14px}

/* night */
.night{--bg:#141A2E;--surface:#1E2540;--sunk:#283052;--line:#2D3558;--ink:#EEF0F8;--ink-2:#A3A9C4;--ink-3:#6E7597;--shadow:none;--brand-soft:#24402A;--brand-tint:#3A5E3B;--acc-soft:#4A3424}
.night .tabs{background:rgba(20,26,46,.92)}
.night .tipbox{background:#1F3326;color:#CFE5C6}
.night .t-ok{color:#A8D99B}
.night .checkin.hot{color:#CFE5C6}
.nstrip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.nstrip i{height:38px;border-radius:7px;background:var(--sunk)}
.nstrip i.d{background:#7C8CF0}.nstrip i.w{background:#4A3E5E}

/* onboarding */
.ob{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:64px 24px 30px}
@media (max-width:519px){.ob{padding-top:28px}}
.ob .bars{display:flex;gap:6px;margin-bottom:24px;align-items:center}
.ob .bars i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.ob .bars i.on{background:var(--brand)}
.ob .back{width:32px;height:32px;margin-right:6px;display:grid;place-items:center;color:var(--ink-2)}
.ob h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px}
.ob .lead{color:var(--ink-2);margin:0 0 22px;font-size:15px}
.ob .body{flex:1;overflow-y:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.wordmark{font-family:Chewy,cursive;font-size:34px;color:var(--brand);letter-spacing:.03em}
.feat{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.feat .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.feat b{font-weight:600;display:block;font-size:15px}
.feat small{color:var(--ink-2);font-size:13px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.qrow .chips{flex:none;flex-wrap:nowrap}
.qrow .chip{padding:6px 12px}
.ob .field .lbl{display:block;margin-bottom:8px}
.qblock{padding:12px 0;border-top:1px solid var(--line)}
.qblock .qq{font-size:14px;font-weight:500;margin-bottom:8px;display:block}
.qblock .chips .chip{padding:6px 12px}

/* coach */
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bub.ai.typing{color:var(--ink-3)}
.bub .src{display:block;font-size:11px;color:var(--ink-3);margin-top:6px}
.askrow{display:flex;gap:8px;align-items:center}
.askrow .txt{flex:1;padding:12px 14px;font-size:15px}
.askrow .send{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -20px 0;padding:0 20px}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{white-space:nowrap;flex:none}
.sitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sitc{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.sitc .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.sitc b{font-size:14px;font-weight:600;line-height:1.3}
.say{border-left:3px solid var(--brand);background:var(--surface);padding:10px 14px;border-radius:0 12px 12px 0;font-size:14px;margin-bottom:8px;font-style:italic}
.ol{counter-reset:s;margin:0 0 16px;padding:0;list-style:none}
.ol li{counter-increment:s;display:flex;gap:12px;padding:8px 0;font-size:14px}
.ol li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:12px;display:grid;place-items:center}

/* kid zone */
.starhero{border-radius:var(--radius);padding:20px;background:#FFF3CF;color:#3D2E00;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.starhero .big{font-family:Chewy,cursive;font-size:56px;line-height:1}
.starhero small{display:block;font-size:13px;opacity:.75}
.starhero .primary{margin-top:12px;height:44px;font-size:14px}
.stickers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.stk{aspect-ratio:1;border-radius:14px;background:var(--sunk);display:grid;place-items:center}
.stk svg{width:70%;height:70%}
.stk.on{background:#FFF8E6}
.stk.new{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.rw{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .tx{flex:1;min-width:0}
.rw b{font-weight:600;font-size:14px;display:block}
.rw small{font-size:12px;color:var(--ink-2)}
.rw .meter{margin-top:6px}
.rw .meter i{background:var(--sun)}
.btn-s{padding:7px 12px;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;font-size:13px;flex:none}
.btn-s.off{background:var(--sunk);color:var(--ink-3)}
.song{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.song:first-child{border-top:0}
.song .play{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.song .play svg.i{width:16px;height:16px}
.song b{font-weight:600;font-size:14px;display:block}
.song small{font-size:12px;color:var(--ink-2)}
.song .fav{margin-left:auto;color:var(--ink-3)}
.song .fav.on{color:var(--acc)}
.song .fav.on svg.i{fill:currentColor}
.lyrics{font-family:Chewy,cursive;font-size:24px;line-height:1.35;text-align:center;margin:10px 0 18px}
.lyrics div{color:var(--ink-3);transition:color .2s,transform .2s}
.lyrics div.on{color:var(--ink);transform:scale(1.04)}
.sit .lyrics{font-size:22px;margin:16px 0 0;min-height:60px}
.sit .lyrics div{display:none}
.sit .lyrics div.on{display:block;color:#16181B;transform:none}
.sit .songpick{margin-top:6px;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;font-weight:600}

/* kid mode */
.kid{background:#FBF7EC;color:#16181B;z-index:45;justify-content:flex-start;padding:70px 20px 30px}
@media (max-width:519px){.kid{padding-top:28px}}
.kid h2{font-family:Chewy,cursive;font-weight:400;font-size:44px;margin:0;line-height:1}
.kid .stars{font-family:Chewy,cursive;font-size:22px;color:#8A6400;margin:6px 0 20px;display:flex;gap:6px;align-items:center}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;flex:1}
.kt{border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:Chewy,cursive;font-size:24px;color:#fff;transition:transform .1s}
.kt:active{transform:scale(.95)}
.kt svg.i{width:64px;height:64px;stroke-width:1.6}
.kexit{margin-top:18px;font-size:13px;font-weight:600;color:#5E6269;padding:10px 16px;border-radius:99px;background:#EFE7D2;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.kexit i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(62,127,51,.25)}
.kexit.hold i{width:100%;transition:width 1.5s linear}

/* sign in */
.auth{position:absolute;inset:0;z-index:52;background:var(--bg);display:flex;flex-direction:column;padding:70px 24px 28px;overflow-y:auto;scrollbar-width:none}
.auth::-webkit-scrollbar{display:none}
.auth>*{flex-shrink:0}
@media (max-width:519px){.auth{padding-top:28px}}
.auth h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:20px 0 8px}
.auth .lead{color:var(--ink-2);margin:0 0 20px;font-size:15px}
.auth .field{margin-bottom:12px}
.auth .txt{margin-top:6px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12px;font-weight:600;margin:22px 0 6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.faq{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-top:1px solid var(--line);text-align:left;color:inherit;text-decoration:none}
.faq:first-of-type{border-top:0}
.faq .tx{flex:1}
.faq b{font-weight:600;font-size:14px;display:block}
.faq small{font-size:12px;color:var(--ink-2)}
.faq .chev{color:var(--ink-3)}
.faqa{font-size:13px;color:var(--ink-2);padding:0 0 14px 50px;margin-top:-6px}
.found{width:72px;height:72px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:30px auto 0}
.found svg.i{width:36px;height:36px;stroke-width:2.4}

/* daily rhythm */
.rhythm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rh{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.rh .top{display:flex;align-items:center;justify-content:space-between}
.rh .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.rh .ic svg.i{width:15px;height:15px}
.rh .ck{width:18px;height:18px;border-radius:50%;border:1.6px solid #CFCBC1;display:grid;place-items:center;color:transparent}
.rh .ck svg.i{width:11px;height:11px;stroke-width:3}
.rh.done .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.rh.now{outline:2px solid var(--brand)}
.rh b{font-size:12.5px;font-weight:600;line-height:1.25}
.rh small{font-size:11px;color:var(--ink-2);line-height:1.3}
.cistep{display:flex;gap:5px;justify-content:center;margin:-6px 0 14px}
.cistep i{width:22px;height:4px;border-radius:9px;background:var(--line)}
.cistep i.on{background:var(--brand)}
.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea.txt{resize:none;height:80px;font-size:15px;line-height:1.45}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* settings screen + shop */
.setscr{position:absolute;inset:0;z-index:15;background:var(--bg);overflow-y:auto;padding:70px 20px 40px;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.setscr::-webkit-scrollbar{display:none}
.setscr.show{transform:none}
@media (max-width:519px){.setscr{padding-top:24px}}
.member{border-radius:var(--radius);padding:18px;background:linear-gradient(150deg,#3E7F33,#2B5C23);color:#fff;margin-bottom:12px}
.prod{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:10px 14px 10px 10px;margin-bottom:10px;color:inherit;text-decoration:none}
.prod img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--sunk);flex:none}
.prod .tx{flex:1;min-width:0}
.prod b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.prod small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.prod .pr{display:block;font-size:13px;font-weight:600;color:var(--brand);margin-top:4px}
.prod .pr span{color:var(--ink-3);font-weight:500}
.prod .chev{color:var(--ink-3)}
.designs{display:flex;gap:10px;overflow-x:auto;margin:0 -20px 12px;padding:2px 20px 6px;scrollbar-width:none}
.designs::-webkit-scrollbar{display:none}
.designs a{flex:none;width:96px;text-decoration:none;color:inherit;text-align:center}
.designs img{width:96px;height:96px;border-radius:18px;object-fit:cover;background:var(--surface);box-shadow:var(--shadow);display:block}
.designs span{display:block;font-size:12px;font-weight:600;margin-top:6px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:9px;font-size:18px;font-weight:600;display:grid;place-items:center}
.stepper button:active{background:var(--surface)}
.stepper b{min-width:26px;text-align:center;font-weight:600}

/* switch */
.sw{width:46px;height:28px;border-radius:99px;background:#D3D0C8;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--brand)}
.sw.on::after{transform:translateX(18px)}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.setrow:first-child{border-top:0}
.setrow .tx{flex:1}
.setrow b{font-weight:600;font-size:14px;display:block}
.setrow small{font-size:12px;color:var(--ink-2)}
.privacy{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--water-soft);color:#1F4370;font-size:13px;margin-bottom:12px}
.privacy b{display:block;font-size:14px;font-weight:600}
</style>
</head>

const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let songStop=null,songIdx=null,songLineCb=null,songAudio=null,noAudioWarned=false;
function playSong(i,loop,onLine){
  stopSong();const s=SONGS[i];songIdx=i;songLineCb=onLine;let stopped=false,timer=null;
  const lyricsOnly=()=>{let li=0;onLine&&onLine(0);timer=setInterval(()=>{li++;if(li>=4){if(!loop){clearInterval(timer);songIdx=null;onLine&&onLine(-1);return}li=0}onLine&&onLine(li)},3500)};
  const au=new Audio('songs/'+slug(s.t)+'.mp3');au.loop=!!loop;songAudio=au;
  au.addEventListener('timeupdate',()=>{if(!stopped&&au.duration)onLine&&onLine(Math.min(3,Math.floor(au.currentTime/au.duration*4)))});
  au.addEventListener('ended',()=>{if(!loop){songIdx=null;onLine&&onLine(-1)}});
  au.addEventListener('error',()=>{if(stopped)return;if(!noAudioWarned){noAudioWarned=true;toast('Song audio coming soon','Lyrics only for now. Sing along!')}lyricsOnly()});
  au.play().catch(()=>{});
  songStop=()=>{stopped=true;clearInterval(timer);try{au.pause()}catch(e){}songAudio=null;songIdx=null};
}
function stopSong(){if(songStop){songStop();songStop=null}}

function sampleWeek(){
  let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const now=Date.now(),today=sod(now),start=today-6*DAY;const ev=[];
  const push=(ts,o)=>{if(ts<now)ev.push({id:uid(),ts,...o})};
  for(let d=0;d<7;d++){
    const base=start+d*DAY,p=d/6;
    const wake=base+(6.8+rnd()*.4)*HR;push(wake,{type:'wake'});
    [7.4,12.1,17.5].forEach(h=>{push(base+(h+rnd()*.2)*HR,{type:'meal'});push(base+(h+.1)*HR,{type:'drink'})});
    [9.9,15.3].forEach(h=>push(base+(h+rnd()*.3)*HR,{type:'drink'}));
    const nap=[12.75,14.4];push(base+nap[1]*HR,{type:'wake'});
    const pooAt=(d===0||d===2||d===4)?2:-1;
    let t=wake+12*MIN,i=0;
    while(t<base+18.8*HR){
      const h=(t-base)/HR;
      if(h>nap[0]&&h<nap[1]){t=base+nap[1]*HR+8*MIN;continue}
      const x=rnd(),accP=.46-p*.36,tryP=.2-p*.1;
      let outcome=x<accP?'accident':x<accP+tryP?'tried':'success';
      if(i===pooAt&&outcome==='tried')outcome='success';
      push(t,{type:'potty',outcome,what:outcome==='tried'?null:(i===pooAt?'poo':'wee'),by:outcome==='success'&&rnd()<.04+p*.5?'child':'prompt'});
      t+=(24+p*34+rnd()*16)*MIN;i++;
    }
  }
  ['wet','wet','dry','wet','dry','dry'].forEach((o,k)=>push(start+(k+1)*DAY+6.6*HR,{type:'night',outcome:o}));
  S.events=ev;S.start=start;S.memberSince=now-18*DAY;S.pants=6;
  // walk the program forward as if each day's check-in said "move on"
  const items=METHODS[S.method].items;S.pIdx=items[0].iv==null&&S.method!=='night'?1:0;S.pDay=1;
  for(let d=0;d<6;d++){const it=items[S.pIdx];S.checkins[start+d*DAY]='Moved on';if(S.pDay<it.len)S.pDay++;else if(S.pIdx<items.length-1){S.pIdx++;S.pDay=1}}
}

const NEED={gap:6,drink:3,wake:3,poo:3};
function learned(){
  const from=sod(Date.now())-5*DAY;const all=evs().filter(e=>e.ts>=from);
  const w=all.filter(isWee);
  const gaps=[],am=[],pm=[];
  for(let i=1;i<w.length;i++){if(sod(w[i].ts)!==sod(w[i-1].ts))continue;
    const between=all.some(e=>e.type==='wake'&&e.ts>w[i-1].ts&&e.ts<w[i].ts); if(between)continue;
    const g=(w[i].ts-w[i-1].ts)/MIN;if(g>180)continue;gaps.push(g);(new Date(w[i-1].ts).getHours()<12?am:pm).push(g)}
  const lag=(type)=>{const out=[];all.filter(e=>e.type===type).forEach(e=>{const n=w.find(x=>x.ts>e.ts&&x.ts-e.ts<2*HR);if(n)out.push((n.ts-e.ts)/MIN)});return out};
  const dl=lag('drink'),wl=lag('wake');
  const poos=S.events.filter(e=>isPotty(e)&&(e.what==='poo'||e.what==='both')).map(e=>{const d=new Date(e.ts);return d.getHours()+d.getMinutes()/60});
  const r=v=>v==null?null:Math.round(v);
  return{
    gap:{n:gaps.length,v:r(median(gaps)),ok:gaps.length>=NEED.gap,am:am.length>=3?r(median(am)):null,pm:pm.length>=3?r(median(pm)):null},
    drink:{n:dl.length,v:r(median(dl)),ok:dl.length>=NEED.drink},
    wake:{n:wl.length,v:r(median(wl)),ok:wl.length>=NEED.wake},

}

function aiContext(){
  const today=sod(Date.now()),st=dayStats(today),L=learned(),it=item();

   `Today so far: ${st.s} on the potty, ${st.a} accidents, ${st.t} sits with nothing, told the parent first ${st.told} times.`,
   `Last 7 days success rate by day (oldest first): ${days.map(d=>d.rate==null?'no logs':d.rate+'%').join(', ')}.`,
   `Learned timing: ${L.gap.ok?`usual gap between wees ${L.gap.v} min`:'not enough data yet'}; ${L.drink.ok?`wee about ${L.drink.v} min after drinks`:'drink timing not learned'}.`,

// The AI coach runs on UpAiry's server, which holds the API key and the coach skill.
// The app sends only the question, recent chat and the anonymous summary from aiContext().
// Expected reply: { reply: "..." }. Leave empty until the server is live: the app falls back to the built-in guides.
const COACH_URL='';
async function askCoach(q){
  q=q.trim();if(!q)return;
  S.chat.push({r:'u',t:q});save();render.keep=true;render();scrollChat();
  if(!COACH_URL){const a=localAnswer(q);S.chat.push({r:'a',t:a.t,src:a.src});save();render.keep=true;render();scrollChat();return}
  const msg={r:'a',t:'Thinking…',src:'UpAiry coach'};S.chat.push(msg);render.keep=true;render();scrollChat();
  try{
    const history=S.chat.slice(0,-2).slice(-12).map(m=>({role:m.r==='u'?'user':'assistant',text:m.t}));
    const res=await fetch(COACH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history,context:aiContext()})});
    if(!res.ok)throw new Error(res.status);
    msg.t=(await res.json()).reply||localAnswer(q).t;
  }catch(e){msg.t="Couldn't reach the coach just now. Here's what the guides say:\n\n"+localAnswer(q).t;msg.src='Built-in guide'}
  save();render.keep=true;render();scrollChat();
}
function localAnswer(q){
  const s=q.toLowerCase();let best=null,score=0;
  SITUATIONS.forEach(x=>{const n=x.kw.filter(k=>s.includes(k)).length;if(n>score){score=n;best=x}});
  if(!best)return{t:`Here's what helps most often:\n• Offer the potty after waking, meals and drinks.\n• Keep reactions to accidents calm and boring.\n• Praise when ${S.child.name||'they'} tell you first.\n\nTap a "Right now" card above for step-by-step help.`,src:'Built-in guide'};
  return{t:best.steps.map(x=>'• '+x).join('\n')+'\n\nTry saying: '+best.say[0],src:'Built-in guide: '+best.t};
}
function scrollChat(){const sc=$('screen'),c=$('chat');if(c)sc.scrollTop=c.offsetTop+c.offsetHeight-sc.clientHeight+180}

const starsNow=()=>Math.max(0,starsEarned()-S.spent);
function KidZone(){
  const nm=esc(S.child.name);const stars=starsNow();
  const wins=S.events.filter(e=>isPotty(e)&&e.outcome==='success').length;const filled=wins%30,page=Math.floor(wins/30)+1;
  return Header('Kid zone',`For ${nm}`,KidChip())+`
  <section class="starhero" id="starhero"><div class="big num">${stars}</div><div style="flex:1"><b style="font-weight:600;font-size:16px">stars to spend</b><small>2 for a wee or poo on the potty, 1 for trying, 3 for a dry night</small><button class="primary" data-a="kidmode">${I('smile')}Hand the phone to ${nm}</button></div></section>
  <section class="card"><div style="display:flex;justify-content:space-between"><span class="lbl">STICKER CHART ${page>1?'· PAGE '+page:''}</span><span class="sub num">${filled}/30</span></div>
    <div class="stickers">${[...Array(30)].map((_,i)=>`<div class="stk ${i<filled?'on':''} ${i===filled-1&&kidNew?'new':''}">${i<filled?sticker(i+(page-1)*30):''}</div>`).join('')}</div>
    <div class="sub" style="margin-top:10px">A new sticker for every success on the potty.</div></section>
  <div class="sec" id="rewardsec"><h2>Rewards</h2><button class="link" data-a="addreward">Add reward</button></div>
  <section class="card" style="padding:6px 18px">${S.rewards.length?S.rewards.map(r=>{const ok=stars>=r.cost;return `<div class="rw"><span class="t-sun" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none">${I('gift')}</span><div class="tx"><b>${esc(r.t)}</b><small class="num">${Math.min(stars,r.cost)} of ${r.cost} stars</small><div class="meter"><i style="width:${Math.min(100,stars/r.cost*100)}%"></i></div></div><button class="btn-s ${ok?'':'off'}" data-a="redeem" data-v="${r.id}">${ok?'Redeem':'Locked'}</button></div>`}).join(''):'<div class="empty">Add a reward your child is excited about.</div>'}</section>
  <div class="sec" id="songsec"><h2>Potty songs</h2><span class="sub">${SONGS.length} songs</span></div>
  <section class="card" style="padding:4px 18px">${SONGS.map((s,i)=>`<div class="song"><button class="play" data-a="song" data-v="${i}" aria-label="Play">${I('music')}</button><button style="flex:1;text-align:left" data-a="song" data-v="${i}"><b>${s.t}</b><small>${s.tag} · ${esc(lyr(s)[0])}</small></button><button class="fav ${S.favs.includes(i)?'on':''}" data-a="fav" data-v="${i}" aria-label="Favourite">${I('heart')}</button></div>`).join('')}</section>`;
}
let kidNew=false;

function hiLine(li){document.querySelectorAll('#lyrics div, #sitlyrics div').forEach((d,k)=>d.classList.toggle('on',k===li))}
let kidHold=null;
function KidMode(){
  const nm=esc(S.child.name);
  $('kid').innerHTML=`<h2>Hi ${nm}!</h2><div class="stars">${I('star').replace('class="i','class="i" style="fill:#F2B705;stroke:#F2B705;width:22px;height:22px')}${starsNow()} stars</div>
  <div class="kgrid">
    <button class="kt" style="background:#3E7F33" data-a="kidlog" data-v="wee">${I('drop')}I did a wee</button>
    <button class="kt" style="background:#8B6447" data-a="kidlog" data-v="poo">${I('poo')}I did a poo</button>
    <button class="kt" style="background:#3A78C9" data-a="kidlog" data-v="tried">${I('hour')}I sat and tried</button>
    <button class="kt" style="background:#C9762A" data-a="kidsong">${I('music')}Potty song</button>
  </div>
  <button class="kexit" id="kexit"><i></i>Grown-ups: press and hold to exit</button>`;
  $('kid').classList.add('show');
  const ex=$('kexit');
  const start=e=>{e.preventDefault();ex.classList.add('hold');kidHold=setTimeout(()=>{$('kid').classList.remove('show');ex.classList.remove('hold');stopSong();render()},1500)};
  const end=()=>{clearTimeout(kidHold);ex.classList.remove('hold')};
  ex.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(t=>ex.addEventListener(t,end));
}
function starBurst(n,msg){
  const el=$('celeb');el.innerHTML=`<svg class="star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#FFD55A" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/></svg><h2>+${n} star${n>1?'s':''}!</h2><p>${esc(msg)}</p><span class="hint">Tap anywhere to continue</span>`;
  el.style.zIndex=48;el.classList.add('show');const cols=['#FFD55A','#FFFFFF','#A8D99B','#FFB27A'];
  for(let i=0;i<40;i++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'%';d.style.background=cols[i%4];d.style.animationDuration=1.8+Math.random()*1.6+'s';d.style.animationDelay=Math.random()*.4+'s';el.appendChild(d)}

/* ================= History ================= */
function History(){
  const today=sod(Date.now());const sel=S.histSel||today;
  const m=S.histMonth?new Date(S.histMonth):new Date(sel);const y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),off=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
  let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){const t=new Date(y,mo,d).getTime();const st=dayStats(t);const fut=t>today;
    const dots=[...Array(Math.min(st.s,4))].map(()=>'<i style="background:var(--brand)"></i>').join('')+[...Array(Math.min(st.a,2))].map(()=>'<i style="background:var(--acc)"></i>').join('');
    cells+=`<button class="dcell ${t===sel?'sel':''} ${fut?'out':''}" data-a="hsel" data-v="${t}" ${fut?'disabled':''}>${d}<span class="pct num">${st.rate==null?'':st.rate+'%'}</span><span class="dots">${dots}</span></button>`}
  const st=dayStats(sel);const list=onDay(sel).reverse().filter(e=>e.type!=='night');const night=onDay(sel,e=>e.type==='night')[0];const ci=S.checkins[sel];
  return Header('History',dayName(sel,{weekday:'long',day:'numeric',month:'long'}),KidChip())+`
  <section class="card">
    <div class="calnav"><button data-a="hmon" data-v="-1" aria-label="Previous month">${I('chevL')}</button><b>${m.toLocaleDateString([], {month:'long',year:'numeric'})}</b><button data-a="hmon" data-v="1" aria-label="Next month">${I('chevR')}</button></div>
    <div class="week">${['M','T','W','T','F','S','S'].map(x=>`<div class="dw">${x}</div>`).join('')}${cells}</div>
  </section>
  <div class="daysum">
    <div><b class="num" style="color:var(--brand)">${st.s}</b><small>On potty</small></div>
    <div><b class="num" style="color:var(--acc)">${st.a}</b><small>Accidents</small></div>
    <div><b class="num">${st.told}</b><small>Told you</small></div>
  </div>
  ${night?`<div class="alert" style="background:${night.outcome==='dry'?'var(--brand-soft)':'var(--acc-soft)'}"><div class="ic" style="color:${night.outcome==='dry'?'var(--brand)':'var(--acc)'}">${I('moon')}</div><div><b>${night.outcome==='dry'?'Dry night':'Wet night'}</b><p>Logged that morning</p></div></div>`:''}
  ${ci?(()=>{const dl=S.days[sel]||{};const md=MOODS.find(m=>m[0]===dl.mood);return `<div class="alert" style="background:var(--sunk)"><div class="ic" style="color:var(--ink-2)">${I(md?md[2]:'route')}</div><div><b>${md?md[1]:'Check-in'}</b><p>${esc(ci)}</p>${dl.tags&&dl.tags.length?`<p style="margin-top:4px">${dl.tags.map(esc).join(' · ')}</p>`:''}${dl.note?`<p style="margin-top:4px;font-style:italic">"${esc(dl.note)}"</p>`:''}</div></div>`})():(sel<sod(Date.now())&&list.length?`<button class="checkin" data-a="checkin" data-v="${sel===sod(Date.now())-DAY?'y':''}" style="margin:0 0 12px" ${sel===sod(Date.now())-DAY?'':'disabled'}><div class="tx"><b>No check-in this day</b><small>${sel===sod(Date.now())-DAY?'Tap to fill it in now':'Check-ins can be filled in for yesterday'}</small></div></button>`:'')}
  <section class="card tl">${list.length?Timeline(list,sel===today):'<div class="empty">Nothing logged this day.</div>'}</section>`;
}

/* ================= Insights ================= */
function Insights(){
  const today=sod(Date.now()),L=learned(),nm=esc(S.child.name);
  const days=[...Array(7)].map((_,i)=>{const d=today-(6-i)*DAY;return{d,...dayStats(d)}});
  const active=days.filter(x=>x.rate!=null);
  const tot=days.reduce((a,x)=>({s:a.s+x.s,told:a.told+x.told,a:a.a+x.a}),{s:0,told:0,a:0});
  const rate=tot.s+tot.a?Math.round(100*tot.s/(tot.s+tot.a)):null;
  const first=active[0]?.rate,last=active[active.length-1]?.rate;
  const toldPct=tot.s?Math.round(100*tot.told/tot.s):null;
  const hrs=[...Array(13)].map((_,i)=>S.events.filter(e=>isPotty(e)&&e.outcome==='accident'&&e.ts>today-13*DAY&&new Date(e.ts).getHours()===7+i).length);
  const hmax=Math.max(1,...hrs);const peak=7+hrs.indexOf(Math.max(...hrs));const hasAcc=hrs.some(Boolean);
  const ph=h=>(h%12||12)+(h<12?' am':' pm');
  const conf=(n,need)=>`<div class="conf">${[...Array(need)].map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
  const row=(ic,tone,t,ok,val,n,need,unit,note)=>`<div class="lrow"><span class="ic ${tone}">${I(ic)}</span><div class="tx"><b>${t}</b>${ok?`<small>${note}</small>`:`<small>Still learning · ${Math.min(n,need)} of ${need} logs</small>${conf(n,need)}`}</div><div class="v num">${ok?val:'–'}${ok?`<small>${unit}</small>`:''}</div></div>`;
  if(!S.events.some(isPotty))return Header('Insights','Last 7 days',KidChip())+`<section class="card"><div class="empty">${I('spark')}<br><b style="font-weight:600;color:var(--ink)">Nothing to show yet</b><br>Insights fill in as you log. A day of logging is enough to see ${nm}'s first patterns.</div></section>`;
  return Header('Insights','Last 7 days',KidChip())+`
  <section class="card" id="learncard">
    <span class="lbl">WHAT WE'VE LEARNED ABOUT ${nm.toUpperCase()}</span>
    <div class="sub" style="margin-top:2px">The timer uses these once there's enough data.</div>
    ${row('clock','t-ok','Time between wees',L.gap.ok,L.gap.v+' min',L.gap.n,NEED.gap,'typical',L.gap.am&&L.gap.pm?`${L.gap.am} min mornings, ${L.gap.pm} min afternoons`:`From ${L.gap.n} gaps`)}
    ${row('cup','t-water','Wee after a drink',L.drink.ok,L.drink.v+' min',L.drink.n,NEED.drink,'later',`From ${L.drink.n} drinks`)}
    ${row('sunrise','t-sun','Wee after waking',L.wake.ok,L.wake.v+' min',L.wake.n,NEED.wake,'later',`From ${L.wake.n} wake-ups`)}
    ${row('poo','t-poo','Usual poo time',L.poo.ok,L.poo.ok?fmt(sod(Date.now())+L.poo.v*HR):'',L.poo.n,NEED.poo,'roughly',`From ${L.poo.n} poos`)}
  </section>
  <div class="grid2">
    <div class="metric"><span class="lbl">Success rate</span><b class="num">${rate??'–'}${rate!=null?'%':''}</b><span class="d ${last>=first?'up':'down'}">${active.length>1?`${first}% → ${last}% this week`:'First day'}</span></div>
    <div class="metric"><span class="lbl">Told you first</span><b class="num">${toldPct??'–'}${toldPct!=null?'%':''}</b><span class="d" style="color:var(--ink-2)">of successes</span></div>
    <div class="metric"><span class="lbl">Accidents a day</span><b class="num">${(tot.a/Math.max(1,active.length)).toFixed(1)}</b><span class="d" style="color:var(--ink-2)">average</span></div>
    <div class="metric"><span class="lbl">Days logged</span><b class="num">${active.length}</b><span class="d" style="color:var(--ink-2)">this week</span></div>
  </div>
  <section class="card">
    <span class="lbl">SUCCESS RATE BY DAY</span>
    <div class="chart">${days.map((x,i)=>`<div class="c ${i===6?'last':''}"><small class="num" style="color:var(--ink-2);font-weight:600">${x.rate==null?'':x.rate}</small><div class="bar" style="height:${x.rate==null?2:Math.max(4,x.rate)}%"></div><small>${dayName(x.d,{weekday:'narrow'})}</small></div>`).join('')}</div>
  </section>
  ${hasAcc?`<section class="card">
    <span class="lbl">WHEN ACCIDENTS HAPPEN</span><div class="sub" style="margin-top:2px">Last 2 weeks, by hour</div>
    <div class="heat">${hrs.map(n=>`<i style="background:${n?`rgba(201,118,42,${.15+.85*n/hmax})`:'var(--sunk)'}"></i>`).join('')}</div>
    <div class="heatlbl"><span>7 am</span><span>1 pm</span><span>7 pm</span></div>
  </section>
  <div class="tipbox">${I('bulb')}<div><b>Most accidents happen around ${ph(peak)}.</b> Offer the potty 15 minutes before then, even if the timer hasn't run out.</div></div>`:''}`;
}

 {g:'Body',q:'Stays dry for 1–2 hours at a stretch'},

const quizRows=()=>QUIZ.map((x,i)=>`<div class="qblock"><span class="lbl">${x.g.toUpperCase()}</span><span class="qq">${x.q}</span><span class="chips">${[[2,'Yes, clearly'],[1,'Sometimes'],[0,'Not yet']].map(([v,l])=>`<button class="chip ${S.quiz[i]===v?'on':''}" data-a="quiz" data-v="${i}" data-x="${v}">${l}</button>`).join('')}</span></div>`).join('');

const WHERE=[
  {v:'none',t:'Still in nappies',s:'Hasn\'t really tried the potty yet',ic:'leaf'},
  {v:'sits',t:'Sits on the potty sometimes',s:'Occasionally, mostly nothing happens',ic:'hour'},

function tick(){
  $('clock').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'');
  if(S.onboarded&&S.rem.on&&T<0){const now=Date.now();
    const meal=[...onDay(sod(now),e=>e.type==='meal')].pop();
    if(S.rem.meals&&meal&&now-meal.ts>20*MIN&&now-meal.ts<35*MIN&&S.notifMeal!==meal.id){S.notifMeal=meal.id;save();showBanner(false,'Time for an after-meal sit','A sit about 20 minutes after eating often catches a wee or poo.')}
    const bt=sod(now)+S.bedtime*HR;if(S.rem.bed&&now>bt-15*MIN&&now<bt&&S.notifBed!==sod(now)){S.notifBed=sod(now);save();showBanner(false,'Bedtime wee soon','One wee before bath and one right before sleep.')}
    const h=new Date(now).getHours()+new Date(now).getMinutes()/60,today=sod(now);
    if(S.rem.morning!==false&&h>=7&&h<10&&!onDay(today,e=>e.type==='wake').length&&S.notifMorn!==today){S.notifMorn=today;save();showBanner(false,`Good morning! Today: ${item().t}`,'Tap to log the wake-up and start the timer.','quickwake')}
    if(S.rem.evening!==false&&h>=18.5&&h<S.bedtime+1.5&&!S.checkins[today]&&onDay(today,isPotty).length&&S.notifEve!==today){S.notifEve=today;save();showBanner(false,'How did today go?','20-second check-in. It sets up tomorrow\'s plan.','checkin')}}
  const n=$('tn');if(!n)return;const p=timerState();const C=2*Math.PI*96;const arc=$('arc'),ring=$('ring');
  ring.classList.remove('due','idle');
  const pb=$('pausebtn');if(pb)pb.innerHTML=p&&p.state==='paused'?I('sunrise')+'Resume':I('pause')+'Pause';
  if(p&&p.state!=='run'){ring.classList.add('idle');arc.style.strokeDashoffset=C;arc.style.stroke='var(--brand)';
    if(p.state==='paused'){n.textContent='Paused';$('tu').textContent=`until ${fmt(p.until)}`;$('why').innerHTML=I('pause')+`<span>${esc(p.why||'Paused')}. No reminders. Logging anything restarts the timer.</span>`}
    else if(p.state==='quiet-soon'){n.textContent='Nearly bedtime';$('tu').textContent='A last wee before bed';$('why').innerHTML=I('moon')+`<span>Quiet hours start at ${hm(S.quietStart??S.bedtime)}. No more timed tries today.</span>`}
    else{n.textContent='Quiet hours';$('tu').textContent=`Timer starts again at ${fmt(p.until)}`;$('why').innerHTML=I('moon')+`<span>No reminders overnight. You can still log anything.</span>`}
    return}
  if(!p){ring.classList.add('idle');n.textContent=item().iv?'Log a wake-up to start':'Routine sits today';$('tu').textContent=item().iv?'':'After waking, meals and before bath';$('why').innerHTML=I('info')+(item().iv?`${esc(item().t)}: offer every ${item().iv} min`:'No timer needed at this step');arc.style.strokeDashoffset=C;return}
  const rem=p.due-Date.now();
  $('why').innerHTML=I(p.why[0])+'<span>'+esc(p.why[1])+'</span>';
  if(rem<=0){ring.classList.add('due');n.textContent='Offer now';$('tu').textContent=Math.round(-rem/MIN)?`due ${Math.round(-rem/MIN)} min ago`:'right on time';arc.style.stroke='var(--acc)';arc.style.strokeDashoffset=0;return}
  arc.style.stroke='var(--brand)';
  n.textContent=Math.ceil(rem/MIN);$('tu').textContent=`min · around ${fmt(p.due)}`;
  arc.style.strokeDashoffset=C*(1-rem/p.total);
  // lenient reminders: after two unanswered tries in a row, stop nudging until the next log
  if(S.rem.on&&rem<S.rem.lead*MIN&&S.notifFor!==p.due&&T<0&&!quiet()&&(p.missed||0)<2){S.notifFor=p.due;save();showBanner();
    try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification(`${S.child.name} may need to go soon`,{body:`Good time to offer the potty, around ${fmt(p.due)}.`})}catch(e){}}
}

  const day=CI.day,isToday=day===sod(Date.now()),st=dayStats(day),nm=esc(S.child.name);
  const dots=`<div class="cistep">${[1,2,3].map(i=>`<i class="${i<=CI.step?'on':''}"></i>`).join('')}</div>`;
  const title=isToday?'How did today go?':'How did yesterday go?';
  if(CI.step===1)return `<div class="sheethd"><span style="width:40px"></span><h2>${title}</h2><button data-a="close">Later</button></div>${dots}
  <div class="daysum" style="margin-bottom:12px"><div><b class="num" style="color:var(--brand)">${st.s}</b><small>On potty</small></div><div><b class="num" style="color:var(--acc)">${st.a}</b><small>Accidents</small></div><div><b class="num">${st.told}</b><small>Told you</small></div></div>
  <section class="card"><b style="font-weight:600;font-size:14px">Anything you didn't log?</b><div class="sub">Add it now so ${nm}'s timing and progress stay accurate.</div>
  <div class="addrow"><button class="chip" data-a="ciadd" data-v="success">+ On the potty</button><button class="chip" data-a="ciadd" data-v="accident">+ Accident</button><button class="chip" data-a="ciadd" data-v="poo">+ Poo on the potty</button></div>
  ${CI.added?`<div class="sub" style="margin-top:10px;color:var(--brand)">Added ${CI.added} missed log${CI.added>1?'s':''}.</div>`:''}</section>
  <button class="primary" data-a="cistep" data-v="2">Looks right</button>`;
  if(CI.step===2)return `<div class="sheethd"><button data-a="cistep" data-v="1">Back</button><h2>${title}</h2><button data-a="close">Later</button></div>${dots}
  <div class="field"><span class="lbl">HOW DID IT FEEL?</span><div class="mood">${MOODS.map(([k,l,ic])=>`<button class="opt ${CI.mood===k?'on':''}" data-a="cimood" data-v="${k}">${I(ic)}${l}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">ANY OF THESE?</span><div class="chips">${TAGS.map(t=>`<button class="chip ${CI.tags.includes(t)?'on':''}" data-a="citag" data-v="${esc(t)}">${t}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">NOTE FOR LATER (OPTIONAL)</span><textarea class="txt" id="cinote" placeholder="e.g. Grandma's house, lots of juice">${esc(CI.note)}</textarea></div>
  <button class="primary" data-a="cistep" data-v="3">Next</button>`;
  return Decision();
}
function Decision(){
  const today=CI.day,st=dayStats(today),it=item(),items=M().items,nm=esc(S.child.name);
  const ok=RULES[it.rule].ok(st);const moreDays=S.pDay<it.len;const nextIt=items[S.pIdx+1];
  let rec,why;
  if(it.rule==='done'){rec='stay';why='This is the last step. Keep going until it feels normal.'}
  else if(st.s+st.a===0&&!['always','night4','night5'].includes(it.rule)){rec='stay';why='Nothing was logged today, so there\'s nothing to judge. Repeat this step tomorrow.'}
  else if(moreDays){rec='next';why=`Day ${S.pDay} of ${it.len} on this step. ${ok?'Today met the goal.':'Today was below the goal, which is normal early on.'}`}
  else if(ok){rec='next';why=`${RULES[it.rule].t}: met today.`}
  else{rec='stay';why=`The goal for this step is: ${RULES[it.rule].t.toLowerCase()}. Not there yet, so one more day usually helps.`}
  const nextLbl=moreDays?`Continue: ${it.t}, day ${S.pDay+1}`:nextIt?`Move on to ${nextIt.t}`:'Keep going';
  const stayLbl=`Repeat ${it.t.replace(/^Day \d: /,'').toLowerCase()} tomorrow`;
  const back=S.pIdx>0?items[S.pIdx-1]:null;
  if(CI.mood==='tough'&&rec==='next'&&!moreDays){rec='stay';why=`You said it was a tough day, so one more day on this step is a good idea even though the numbers look okay.`}
  return `<div class="sheethd"><button data-a="cistep" data-v="2">Back</button><h2>Plan for tomorrow</h2><button data-a="close">Later</button></div><div class="cistep">${[1,2,3].map(()=>'<i class="on"></i>').join('')}</div>
  <div class="daysum" style="margin-bottom:0"><div><b class="num" style="color:var(--brand)">${st.s}</b><small>On potty</small></div><div><b class="num" style="color:var(--acc)">${st.a}</b><small>Accidents</small></div><div><b class="num">${st.rate==null?'–':st.rate+'%'}</b><small>Success</small></div></div>
  <div class="rec"><span class="lbl">${I('route')}THE PROGRAM SUGGESTS</span><b>${rec==='next'?nextLbl:stayLbl}</b><p>${why}</p></div>
  <button class="primary" data-a="ci" data-v="${rec}">${rec==='next'?nextLbl:stayLbl}</button>
  <button class="ghost" data-a="ci" data-v="${rec==='next'?'stay':'next'}">${rec==='next'?stayLbl:nextLbl}</button>
  ${back?`<button class="textbtn" data-a="ci" data-v="back">Hard day? Go back to ${back.t}</button>`:''}
  <p class="sub" style="text-align:center;margin:14px 0 0">${nm}'s progress is never lost. You can change step any time in Program.</p>`;
}
function handoffText(){
  const today=sod(Date.now()),st=dayStats(today),p=predict();
  const lw=[...onDay(today,isWee)].pop();const lp=lastPoo();
  return `${S.child.name}: potty update, ${dayName(Date.now(),{weekday:'short'})} ${fmt(Date.now())}

Last wee: ${lw?fmt(lw.ts)+(lw.outcome==='success'?' on the potty':' (accident)'):'none yet today'}
Next try: ${p?'around '+fmt(p.due):'soon after waking'}, then about every ${p?p.gap:item().iv||60} min
Today: ${st.s} on the potty, ${st.a} accident${st.a===1?'':'s'}
Last poo: ${lp?dayName(lp.ts,{weekday:'long'})+' '+fmt(lp.ts):'not logged'}

Program: ${M().name}, ${item().t}
Words: ${S.child.words||'wee and poo'}
Offer after meals and drinks, and before going out. After accidents, keep it calm: "wee goes in the potty".`;
}

/* ================= sit timer + celebrate ================= */
let sitH=null;
function startSit(si){
  const el=$('sit');let left=180;const C=2*Math.PI*96;
  if(si==null)si=S.sitSong??(S.favs.length?S.favs[Math.floor(Math.random()*S.favs.length)]:Math.floor(Math.random()*SONGS.length));
  let sing=S.sitMusic!==false,line=0;
  const startMusic=()=>{if(sing)playSong(si,true,li=>{line=li;hiLine(li)});else stopSong()};
  const draw=()=>{const s=SONGS[si];el.innerHTML=`<svg class="sand" viewBox="0 0 216 216"><circle cx="108" cy="108" r="96" fill="none" stroke="#EFE7D2" stroke-width="14"/><circle cx="108" cy="108" r="96" fill="none" stroke="var(--brand)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-left/180)}" transform="rotate(-90 108 108)" style="transition:stroke-dashoffset 1s linear"/><text x="108" y="126" text-anchor="middle" style="font-family:Poppins,sans-serif;font-weight:600;font-size:52px;letter-spacing:-2px" fill="#16181B">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</text></svg>
    <div class="big">Potty time!</div>
    ${sing?`<div class="lyrics" id="sitlyrics">${lyr(s).map((l,k)=>`<div class="${k===line?'on':''}">${esc(l)}</div>`).join('')}</div><button class="songpick" data-a="sitnext">${I('music')}${s.t} · next song</button>`:`<p>Sit with ${esc(S.child.name)} and read a book.</p>`}
    <button class="songpick" data-a="sitmute" style="margin-left:10px">${sing?'Music off':'Music on'}</button>
    <div style="display:flex;gap:10px;width:100%;margin-top:24px"><button class="ghost" style="margin:0;background:#EFE7D2" data-a="sitstop" data-v="tried">Nothing came</button><button class="primary" style="margin:0" data-a="sitstop" data-v="success">They went!</button></div>`};
  startSit.next=()=>{si=(si+1)%SONGS.length;line=0;startMusic();draw()};
  startSit.mute=()=>{sing=!sing;S.sitMusic=sing;save();line=0;startMusic();draw()};
  draw();el.classList.add('show');startMusic();clearInterval(sitH);sitH=setInterval(()=>{left--;if(left<=0){clearInterval(sitH);left=0}draw()},1000);
}
function celebrate(){
  const el=$('celeb');
  el.innerHTML=`<svg class="star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#FFD55A" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/></svg><h2>${esc(S.child.name)} did it!</h2><p>Big high five</p><span class="hint">Tap anywhere to close</span>`;
  el.classList.add('show');const cols=['#FFD55A','#FFFFFF','#A8D99B','#FFB27A'];
  for(let i=0;i<50;i++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'%';d.style.background=cols[i%4];d.style.animationDuration=1.8+Math.random()*1.6+'s';d.style.animationDelay=Math.random()*.5+'s';el.appendChild(d)}
}
$('celeb').addEventListener('click',()=>$('celeb').classList.remove('show'));

/* ================= toast ================= */
let lastAdded=null;
function toast(title,sub,undo){const t=$('toast');t.innerHTML=`<div class="tx">${title}${sub?`<small>${sub}</small>`:''}</div>${undo?'<button data-a="undo">Undo</button>':''}`;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3800)}
function add(e){S.events.push(e);lastAdded=e.id;if((e.type==='potty'||e.type==='wake')&&S.pausedUntil>Date.now())S.pausedUntil=0}
function PauseSheet(){
  const qs=sod(Date.now())+(S.quietStart??S.bedtime)*HR;
  const o=(min,label,sub)=>`<button class="setrow" data-a="pauseset" data-v="${min}" data-x="${label}"><span class="tx"><b>${label}</b><small>${sub}</small></span>${I('chevR')}</button>`;
  return `<div class="sheethd"><span style="width:40px"></span><h2>Pause the timer</h2><button data-a="close">Cancel</button></div>
  <p class="sub" style="margin:-6px 2px 14px">No reminders while paused. Logging a wee, poo or wake-up restarts it straight away.</p>
  <section class="card" style="padding:4px 18px">
    ${o(120,'Nap time','Up to 2 hours, or until you log the wake-up')}
    ${o(60,'Out for an hour','Remember a wee before you leave')}
    ${o(120,'Out for 2 hours','Pack spare pants and a wet bag')}
    ${o(Math.max(30,Math.round((qs-Date.now())/MIN)),'Rest of today',`Until quiet hours at ${hm(S.quietStart??S.bedtime)}`)}
  </section>`;
}
function learnedNote(before){const after=learned();if(!before.gap.ok&&after.gap.ok)return`Learned ${S.child.name}'s rhythm: about every ${after.gap.v} min`;if(!before.drink.ok&&after.drink.ok)return`Learned: wee about ${after.drink.v} min after drinks`;return null}

/* ================= actions ================= */

    const p=predict();const m=evMeta(e);const ln=learnedNote(before);toast(ln||m.t,p?'Next try around '+fmt(p.due):'',true);if(e.outcome==='success')setTimeout(celebrate,250);return}

  case 'del':S.events=S.events.filter(e=>e.id!==v);render.keep=true;break;

  case 'sitnext':startSit.next();return;

    add({id:uid(),ts,type:'potty',outcome:v==='accident'?'accident':'success',what:v==='poo'?'poo':'wee',by:'prompt',late:true});CI.added=(CI.added||0)+1;save();openSheet.keep=true;openSheet(CheckinSheet());render.keep=true;render();return}
  case 'cimood':{const n=$('cinote');if(n)CI.note=n.value;CI.mood=v;openSheet.keep=true;openSheet(CheckinSheet());return}
  case 'citag':{const n=$('cinote');if(n)CI.note=n.value;CI.tags=CI.tags.includes(v)?CI.tags.filter(x=>x!==v):[...CI.tags,v];openSheet.keep=true;openSheet(CheckinSheet());return}
  case 'quickwake':$('banner').classList.remove('show');add({id:uid(),ts:Date.now(),type:'wake'});save();render.keep=true;render();toast('Good morning!',`Today: ${item().t}. The timer has started.`,true);return;
  case 'ci':{const items=M().items,it=item();let msg;
    if(v==='next'){if(S.pDay<it.len){S.pDay++;msg=`Tomorrow: ${it.t}, day ${S.pDay}`}else if(S.pIdx<items.length-1){S.pIdx++;S.pDay=1;msg=`Moved on to ${item().t}`}else msg='Kept going'}
    else if(v==='stay'){msg=`Repeating ${it.t} tomorrow`}

    closeSheet();const sk=ciStreak();toast(`${CI.day===sod(Date.now())?'Day logged':'Yesterday logged'}${sk>1?` · ${sk}-day streak`:''}`,msg);render.keep=true;break}
  case 'pitem':{const i=+v,s=M().items[i];if(i===S.pIdx){S.tab='today';break}
    openSheet(`<div class="sheethd"><span style="width:40px"></span><h2>${s.t}</h2><button data-a="close">Done</button></div><div class="sub" style="margin:-8px 0 14px;text-align:center">${s.d}${s.iv?' · offer every '+s.iv+' min':''}</div>
    <section class="card" style="padding:4px 18px">${s.steps.map(x=>`<div class="step" style="margin:0"><span class="box" style="border-color:var(--line)"></span><span>${x}</span></div>`).join('')}</section>

  case 'mode':S.mode=v;save();openSheet.keep=true;openSheet(TimerSheet());render.keep=true;render();return;

  case 'copy':navigator.clipboard?.writeText(handoffText()).then(()=>toast('Copied','Paste it into a text or WhatsApp')).catch(()=>toast('Copy not available here'));closeSheet();return;

  case 'au':{const r=authRead();if(r.email)AU.email=r.email;AU.mode=v;AU.sent=false;break}
  case 'aufaq':AU.faq=AU.faq===+v?null:+v;break;

    <div class="field"><span class="lbl">WORDS THEY USE FOR WEE AND POO</span><input class="txt" id="ekw" value="${esc(S.child.words)}" autocomplete="off"></div>`);return;
  case 'ekage':S.child.age=v;document.querySelectorAll('[data-a=ekage]').forEach(c=>c.classList.toggle('on',c.dataset.v===v));save();return;
  case 'savekid':{const n=$('ekn').value.trim();if(n)S.child.name=n;S.child.words=$('ekw').value.trim();closeSheet();toast('Saved');break}
  /* progress, coach */
  case 'pview':S.progView=v;break;
  case 'situ':{const s=SITUATIONS[+v];openSheet(`<div class="sheethd"><span style="width:40px"></span><h2>${s.t}</h2><button data-a="close">Done</button></div>
    <span class="lbl" style="display:block;margin:0 2px 6px">WHAT TO DO</span><ol class="ol">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <span class="lbl" style="display:block;margin:0 2px 8px">WHAT TO SAY</span>${s.say.map(x=>`<div class="say">${esc(x)}</div>`).join('')}
    <button class="ghost" data-a="askq" data-v="${esc('Help: '+s.t.toLowerCase()+'. What should I try next?')}">${I('chat')}Ask the coach about this</button>`);return}
  case 'aiset':openSheet(AiSheet());return;
  case 'ask':{const q=$('askin').value;closeSheet();askCoach(q);return}
  case 'askq':closeSheet();S.tab='coach';render();askCoach(v);return;
  case 'clearchat':S.chat=[];break;
  /* kid zone */
  case 'kidmode':KidMode();return;
  case 'kidlog':{add({id:uid(),ts:Date.now(),type:'potty',outcome:v==='tried'?'tried':'success',what:v==='tried'?null:v,by:'child'});kidNew=v!=='tried';save();
    const n=v==='tried'?1:2;starBurst(n,v==='tried'?'Great trying!':`${S.child.name} did it!`);KidMode();return}
  case 'kidsong':{const i=S.favs.length?S.favs[Math.floor(Math.random()*S.favs.length)]:Math.floor(Math.random()*SONGS.length);startSit(i);return}
  case 'addreward':openSheet(`<div class="sheethd"><button data-a="close">Cancel</button><h2>New reward</h2><button data-a="saverew" style="color:var(--brand)">Save</button></div>
    <div class="field"><span class="lbl">REWARD</span><input class="txt" id="rwt" placeholder="e.g. Pick the bedtime story" autocomplete="off"></div>
    <div class="field"><span class="lbl">STARS NEEDED</span><div class="chips">${[5,10,15,20,30,50].map(n=>`<button class="chip ${n===10?'on':''}" data-a="rwc" data-v="${n}">${n}</button>`).join('')}</div></div>
    <div class="sub">Small, frequent rewards work better than one big prize. Time together counts as much as treats.</div>`);rwCost=10;return;
  case 'rwc':rwCost=+v;document.querySelectorAll('[data-a=rwc]').forEach(c=>c.classList.toggle('on',c.dataset.v===v));return;
  case 'saverew':{const t=$('rwt').value.trim();if(!t){$('rwt').focus();return}S.rewards.push({id:uid(),t,cost:rwCost});closeSheet();break}
  case 'redeem':{const r=S.rewards.find(x=>x.id===v);if(!r||starsNow()<r.cost){toast('Not enough stars yet',`${r?r.cost-starsNow():0} more to go`);return}S.spent+=r.cost;save();render();starBurst(r.cost,`Reward unlocked: ${r.t}`);$('celeb').querySelector('h2').textContent='Reward time!';return}
  case 'song':openSheet(SongSheet(+v));return;
  case 'songplay':{const i=+v;const btn=$('songbtn');if(songIdx===i){stopSong();hiLine(-1);btn.innerHTML=I('music')+'Play';return}
    playSong(i,false,li=>{hiLine(li);if(li<0&&$('songbtn'))$('songbtn').innerHTML=I('music')+'Play'});btn.innerHTML=I('pause')+'Stop';return}
  case 'songclose':stopSong();closeSheet();return;
  case 'sitsong':S.sitSong=+v;stopSong();closeSheet();toast(SONGS[+v].t+' set for the sit timer');save();return;
  case 'fav':{const i=+v;S.favs=S.favs.includes(i)?S.favs.filter(x=>x!==i):[...S.favs,i];render.keep=true;break}
  /* settings */
  case 'quizsheet':quizOpen=true;openSheet(QuizSheet());return;
  case 'remset':openSheet(RemSheet());return;
  case 'remtog':S.rem[v]=!S.rem[v];save();openSheet.keep=true;openSheet(RemSheet());render.keep=true;render();return;
  case 'remlead':S.rem.lead=+v;save();openSheet.keep=true;openSheet(RemSheet());return;
  case 'notifperm':Notification.requestPermission().then(()=>openSheet(RemSheet()));return;
  case 'privacy':openSheet(PrivacySheet());return;
  case 'export':{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),child:S.child,method:S.method,events:S.events,checkins:S.checkins},null,2)],{type:'application/json'});
    const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='upairy-potty-data.json';a2.click();toast('Exported','Saved as upairy-potty-data.json');return}
  /* onboarding */
  case 'obback':OB=Math.max(0,OB-1);if(OB===3&&S.where==='day')OB=2;break;
  case 'age':S.child.age=v;readObInputs();break;
  case 'where':S.where=v;S.method=null;break;
  case 'quiz':S.quiz[v]=+b.dataset.x;if(quizOpen){save();openSheet.keep=true;openSheet(QuizSheet());return}S.method=null;break;
  case 'home3':S.home3=+v;S.method=null;break;
  case 'pick':S.method=v;break;
  case 'smode':S.startMode=v;break;
  case 'ob':
    if(OB===1){readObInputs();if(!S.child.name){$('obn').focus();$('obn').style.borderColor='var(--acc)';return}}
    if(OB===2&&!S.where)return;
    if(OB===4&&!S.method)S.method=recommend();
    if(OB===6){S.pIdx=startIndex();S.pDay=1;S.start=sod(Date.now());S.night=S.method==='night';
      if(S.startMode==='sample')sampleWeek();
      S.onboarded=true;S.tab='today';save();render();setTimeout(()=>tourShow(0),350);return}
    OB++;break;
  }
  save();render();
});
let rwCost=10,quizOpen=false;
function QuizSheet(){const sc=quizScore();
  return `<div class="sheethd"><span style="width:40px"></span><h2>Readiness check</h2><button data-a="close">Done</button></div>
  ${sc!=null?`<div class="tipbox">${I('check')}<div><b>${sc}% · ${quizVerdict(sc)}</b><br>${sc>=70?'Most readiness signs are there.':sc>=45?'Some signs are there. A relaxed start or a few more weeks of getting ready both work.':'Give it a few weeks of potty-in-the-routine, then check again.'}</div></div>`:''}
  ${quizRows()}`}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='askin'){askCoach(e.target.value)}});
$('scrim').addEventListener('transitionend',()=>{if(!$('scrim').classList.contains('show')){quizOpen=false;if(songIdx!=null&&!$('sit').classList.contains('show')){stopSong()}}});
function readObInputs(){const n=$('obn'),w=$('obw');if(n)S.child.name=n.value.trim();if(w)S.child.words=w.value.trim()}
render();
</script>
</body>
</html>
